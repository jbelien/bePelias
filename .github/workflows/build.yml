name: Docker Image CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-best-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Fedict/best-tools
          ref: 1.5.0
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: "microsoft"
          java-version: "17"
      - name: Build best-tools
        run: |
          cd java
          mvn clean install -DskipTests
      - uses: actions/upload-artifact@v7
        with:
          name: best-tools-artifact
          path: |
            java/converter/target/converter-*.jar

  build-docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile_api
          push: ${{ github.event_name != 'pull_request' }}
          tags: bepelias-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docker-dataprep:
    runs-on: ubuntu-latest
    needs: build-best-tools
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: best-tools-artifact
      - run: |
          ls -alR
          ls -alR best-tools-artifact
          ls -alR best-tools-artifact/java/converter/target
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile_dataprep
          push: ${{ github.event_name != 'pull_request' }}
          tags: bepelias-dataprep:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
