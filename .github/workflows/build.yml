name: Docker Image CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:

  build-docker-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile_api
          push: ${{ github.event_name != 'pull_request' }}
          tags: bepelias-api:$(date +%s),bepelias-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-docker-dataprep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile_dataprep
          push: ${{ github.event_name != 'pull_request' }}
          tags: bepelias-dataprep:$(date +%s),bepelias-dataprep:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
