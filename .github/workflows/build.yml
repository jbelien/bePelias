name: Docker Image CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:

  build-docker-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file docker/Dockerfile_api --tag bepelias-api:$GITHUB_BASE_REF-$GITHUB_SHA

  build-docker-dataprep:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file docker/Dockerfile_dataprep --tag bepelias-dataprep:$GITHUB_BASE_REF-$GITHUB_SHA
